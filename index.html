<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Câmbio & Transferências</title>
  <meta name="description" content="Calculadora de câmbio Metical e Rublo" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #5c0a2c;
      --navy-2: #3a061c;
      --sky: #7d103d;
      --sky-soft: #f9f0f4;
      --gold: #b8965a;
      --gold-dark: #8f7240;
      --gold-light: #d4bc8a;
      --bg: #f7f5f3;
      --white: #ffffff;
      --text: #1c1216;
      --muted: #6b5c63;
      --border: #e8e0e4;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 28px 20px 56px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 12px 12px;
      background: var(--white);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(92, 10, 39, 0.07);
    }
    .logo-wrap img {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .switch {
      display: flex;
      padding: 4px;
      gap: 4px;
      background: var(--sky-soft);
      border-radius: 999px;
      border: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .switch button {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 10px 12px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s var(--ease), color 0.2s, box-shadow 0.2s;
    }
    .switch button.active {
      background: var(--white);
      color: var(--navy);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(92, 10, 39, 0.10);
    }
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 18px 18px;
      box-shadow: 0 4px 20px rgba(92, 10, 39, 0.07);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card.focused {
      border-color: var(--sky);
      box-shadow: 0 0 0 3px rgba(125, 16, 61, 0.12);
    }
    .label {
      display: block;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .input-big {
      flex: 1 1 160px;
      min-width: 0;
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--navy);
      font: inherit;
      font-size: 40px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.04em;
      padding: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--sky-soft);
      border: 1px solid var(--border);
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .badge svg { display: block; }
    .result {
      background: linear-gradient(165deg, #f9f0f4 0%, #ffffff 58%);
      border: 1px solid var(--gold-light);
      border-radius: 16px;
      padding: 24px 20px 22px;
      box-shadow: 0 10px 28px rgba(184, 150, 90, 0.18);
    }
    .result-value {
      font-size: 44px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--navy);
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 1.05em;
    }
    .settings {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 4px 0 2px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .settings strong {
      color: var(--navy);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      margin-top: 4px;
      background: linear-gradient(135deg, var(--sky), var(--navy));
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(92, 10, 39, 0.28);
      transition: transform 0.2s var(--ease), filter 0.2s, box-shadow 0.2s, opacity 0.2s;
      opacity: 0.4;
    }
    .btn:not(:disabled) { opacity: 1; }
    .btn:not(:disabled):hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      color: #1a1208;
      box-shadow: 0 10px 28px rgba(184, 150, 90, 0.28);
    }
    .btn:disabled { cursor: not-allowed; }
  </style>
</head>

    </div>

    <div class="switch" role="tablist">
      <button type="button" id="btnMznRub" class="active" data-dir="mzn_rub">Metical → Rublo</button>
      <button type="button" id="btnRubMzn" data-dir="rub_mzn">Rublo → Metical</button>
    </div>

    <div class="card" id="inputCard">
      <span class="label" id="entradaLabel">Meticais</span>
      <div class="row">
        <input class="input-big" id="entrada" type="text" inputmode="decimal" placeholder="0" aria-label="Valor" autocomplete="off" />
        <div class="badge" id="entradaBadge">
          <span id="flagIn"></span>
          <span id="entradaCodigo">MZN</span>
        </div>
      </div>
    </div>

    <div class="result">
      <span class="label" id="saidaLabel">Rublos</span>
      <div class="result-value">
        <span id="saida"></span>
        <div class="badge">
          <span id="flagOut"></span>
          <span id="saidaCodigo">RUB</span>
        </div>
      </div>
    </div>

    <div class="settings" id="cambioLine">
      Câmbio do dia · <span id="taxaData">…</span>
      · 1 RUB = <strong id="taxaValor">…</strong> MT
    </div>

    <button type="button" class="btn" id="btnCopiar" disabled>Copiar cotação</button>
  </div>

  <script>
(function () {
  var MARGEM = 1.15;
  var FALLBACK_TAXA = 0.7799;
  var FALLBACK_DATA = "6 Nov 2026";
  var taxa = FALLBACK_TAXA;
  var taxaData = FALLBACK_DATA;
  var direcao = "mzn_rub";
  var copiadoTimer = null;

  var flagMZ = '<svg width="26" height="18" viewBox="0 0 30 21" aria-hidden="true"><rect width="30" height="7" y="0" fill="#007168"/><rect width="30" height="7" y="7" fill="#000"/><rect width="30" height="7" y="14" fill="#FCE100"/><polygon points="0,0 14,10.5 0,21" fill="#D21034"/><circle cx="5.2" cy="10.5" r="2.4" fill="#FCE100"/></svg>';
  var flagRU = '<svg width="26" height="18" viewBox="0 0 30 21" aria-hidden="true"><rect width="30" height="7" y="0" fill="#fff"/><rect width="30" height="7" y="7" fill="#0039A6"/><rect width="30" height="7" y="14" fill="#D52B1E"/></svg>';

  function fmt(n, casas) {
    if (!isFinite(n)) return "";
    var fixed = n.toFixed(casas);
    var parts = fixed.split(".");
    var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    if (casas === 0 || !parts[1]) return intPart;
    return intPart + "," + parts[1];
  }

  function parseNum(s) {
    var n = Number(String(s).replace(/\s/g, "").replace(",", "."));
    return isFinite(n) ? n : NaN;
  }

  function mesesPt(d) {
    var m = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    return d.getUTCDate() + " " + m[d.getUTCMonth()] + " " + d.getUTCFullYear();
  }

  function setTaxaUI() {
    document.getElementById("taxaData").textContent = taxaData;
    document.getElementById("taxaValor").textContent = fmt(taxa, 4);
    recalc();
  }

  function updateDirUI() {
    var mznRub = direcao === "mzn_rub";
    document.getElementById("btnMznRub").classList.toggle("active", mznRub);
    document.getElementById("btnRubMzn").classList.toggle("active", !mznRub);
    document.getElementById("entradaLabel").textContent = mznRub ? "Meticais" : "Rublos";
    document.getElementById("saidaLabel").textContent = mznRub ? "Rublos" : "Meticais";
    document.getElementById("entradaCodigo").textContent = mznRub ? "MZN" : "RUB";
    document.getElementById("saidaCodigo").textContent = mznRub ? "RUB" : "MZN";
    document.getElementById("flagIn").innerHTML = mznRub ? flagMZ : flagRU;
    document.getElementById("flagOut").innerHTML = mznRub ? flagRU : flagMZ;
    document.getElementById("entrada").value = "";
    document.getElementById("saida").textContent = "";
    document.getElementById("btnCopiar").disabled = true;
  }

  function recalc() {
    var entrada = parseNum(document.getElementById("entrada").value);
    var saidaEl = document.getElementById("saida");
    var btn = document.getElementById("btnCopiar");
    if (!(entrada > 0) || !(taxa > 0)) {
      saidaEl.textContent = "";
      btn.disabled = true;
      return;
    }
    var saida = direcao === "mzn_rub" ? entrada / taxa / MARGEM : entrada * taxa;
    saidaEl.textContent = fmt(Math.round(saida), 0);
    btn.disabled = false;
  }

  function textoCotacao() {
    var entrada = parseNum(document.getElementById("entrada").value);
    var saida = direcao === "mzn_rub" ? entrada / taxa / MARGEM : entrada * taxa;
    if (!(entrada > 0) || !(saida > 0)) return "";
    if (direcao === "mzn_rub") {
      return [
        "Cotação de câmbio",
        "",
        "Cliente envia: " + fmt(entrada, 0) + " MT",
        "Cliente recebe: " + fmt(Math.round(saida), 0) + " RUB",
        "Câmbio do dia: 1 RUB = " + fmt(taxa, 4) + " MT (" + taxaData + ")",
        "Margem: 15%"
      ].join("\\n");
    }
    return [
      "Cotação de câmbio",
      "",
      "Cliente envia: " + fmt(entrada, 0) + " RUB",
      "Cliente recebe: " + fmt(Math.round(saida), 0) + " MT",
      "Câmbio do dia: 1 RUB = " + fmt(taxa, 4) + " MT (" + taxaData + ")"
    ].join("\\n");
  }

  document.getElementById("btnMznRub").addEventListener("click", function () {
    direcao = "mzn_rub";
    updateDirUI();
  });
  document.getElementById("btnRubMzn").addEventListener("click", function () {
    direcao = "rub_mzn";
    updateDirUI();
  });

  var entrada = document.getElementById("entrada");
  var card = document.getElementById("inputCard");
  entrada.addEventListener("input", recalc);
  entrada.addEventListener("focus", function () { card.classList.add("focused"); });
  entrada.addEventListener("blur", function () { card.classList.remove("focused"); });

  document.getElementById("btnCopiar").addEventListener("click", function () {
    var t = textoCotacao();
    if (!t) return;
    var btn = document.getElementById("btnCopiar");
    function ok() {
      btn.textContent = "Cotação copiada";
      if (copiadoTimer) clearTimeout(copiadoTimer);
      copiadoTimer = setTimeout(function () { btn.textContent = "Copiar cotação"; }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(ok).catch(function () {
        var ta = document.createElement("textarea");
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); ok(); } catch (e) {}
        document.body.removeChild(ta);
      });
    }
  });

  updateDirUI();
  setTaxaUI();

  fetch("https://open.er-api.com/v6/latest/RUB")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.result === "success" && d.rates && d.rates.MZN > 0) {
        taxa = Number(d.rates.MZN);
        if (d.time_last_update_utc) {
          var dt = new Date(d.time_last_update_utc);
          if (!isNaN(dt.getTime())) taxaData = mesesPt(dt);
        }
        setTaxaUI();
      }
    })
    .catch(function () { /* keep fallback */ });
})();
  </script>
</body>
</html>
